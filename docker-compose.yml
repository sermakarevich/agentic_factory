# Local services of agentic_factory. Start with `just db`; data lives in the named volume.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_DB: factory
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - factory_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  factory_postgres:
