[project]
name = "factory-prompts"
version = "0.1.0"
description = "The one prompt renderer every app fills its .md templates with. Imports no other factory package."
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_prompts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
