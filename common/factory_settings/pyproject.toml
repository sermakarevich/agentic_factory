[project]
name = "factory-settings"
version = "0.1.0"
description = "How every package reads its settings.toml, and the values they share (the database url). Imports no other factory package."
requires-python = ">=3.13"
dependencies = [
    "dynaconf>=3.3.5",
    "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_settings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
