[project]
name = "factory-store"
version = "0.1.0"
description = "The factory's database: sessions, tries, events, conversations and reports. Shared by the app and the runners; imports neither."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["factory_store"]  # migrations/ sits outside src, so ruff would sort it as third-party

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
