[temporal]
address = "127.0.0.1:7233"   # not "localhost": it resolves to ::1 first on macOS, the dev server is IPv4 only
namespace = "default"          # the Temporal namespace the runner and its workflows live in
task_queue = "agentic-factory"  # the queue the runner polls and the cli starts workflows on

[runner]
max_concurrent_activities = 4   # each job activity is one coder process on this machine

[cli]
job_id_chars = 8    # of the uuid after "job-" in a workflow id: enough to tell runs apart in the ui

[job_activity]
session_timeout_sec = 60     # creating the session before try 1; opencode's api answers in seconds
heartbeat_margin_sec = 60   # heartbeat timeout = job.stall_sec + this; the engine kills first, Temporal is the backstop
close_margin_sec = 120      # start-to-close = job.timeout_sec + this
max_attempts = 5            # tries per job before the workflow gives up
retry_initial_sec = 10      # wait before try 2; a rate limit overrides it with its reset time
retry_backoff = 2.0         # each later wait is the previous one times this
retry_max_sec = 600         # the longest backoff wait
min_retry_delay_sec = 1     # the shortest wait after a rate limit whose reset time has passed

[report_activity]
close_margin_sec = 60   # start-to-close = the app's step.timeout_sec + this; the step's own timeout fires first
max_attempts = 3        # tries of the report step before the workflow gives it up

[record_activity]
timeout_sec = 30    # two store queries: the tries read, the job row written
max_attempts = 5    # tries before the workflow gives the row up and logs it

[structured_output_activity]
close_margin_sec = 60   # start-to-close = two of the app's step.timeout_sec (last message, then the conversation) + this
max_attempts = 3        # tries of the extraction before the workflow fails; "not stated" is final and skips them

[judge_activity]
close_margin_sec = 30   # start-to-close = the judgment's timeout_sec + this; the step's own timeout fires first
max_attempts = 3        # tries of the judge step before the workflow gives it up

[distill_workflow]
provider = "opencode"                              # the coder every distill job runs on
model = "opencode-go/muse-spark-1.3-contributor"   # its model; "" would mean the harness default
job_timeout_sec = 3600   # one distill job's own limit; the biggest wiki chunk takes minutes, not an hour
job_stall_sec = 600      # a job with no event for this long is killed
index_attempts = 3       # index job runs (the first, then one per failed verification) before the workflow fails

[research_workflow]
provider = "opencode"                              # the coder every research writing job runs on
model = "opencode-go/muse-spark-1.3-contributor"   # its model; "" would mean the harness default
planning_provider = "claude"   # the coder the discover and assign jobs run on
planning_model = "opus"        # their model: planning needs the stronger searching model
job_timeout_sec = 3600         # one writing job's own limit
job_stall_sec = 600            # a job with no event for this long is killed
planning_timeout_sec = 7200    # one planning job's own limit; discover searches the web and takes longer
sources_at_once = 3            # child distill runs at the same time; each one spends several coder slots

[fetch_activity]
timeout_sec = 300   # start-to-close of the fetch: a few http calls (60 s each) or one cli call (180 s) with their retries
max_attempts = 3    # tries of a transient fetch failure (network, a rate-limited tool) before the workflow fails

[verify_activity]
timeout_sec = 30    # a walk over one entry folder
max_attempts = 3    # tries before the workflow fails

[beads_poller]
interval_sec = 10       # the Temporal Schedule tick and the `af beads poll` daemon loop
batch_limit = 10        # ready beads considered per tick
max_in_flight = 4       # running job workflows at which a tick spawns nothing
orphan_timeout_sec = 600  # an in_progress bead with no af marker and no workflow this old is released
schedule_id = "beads-poll"  # the Temporal Schedule id `af beads schedule` owns
command_timeout_sec = 30  # one `fleet`/`bd` subprocess call before it fails the tick
tick_timeout_sec = 300  # start-to-close of the poll activity: reconcile plus one batch

[locate_activity]
timeout_sec = 30    # validating the topic and making the target folder
max_attempts = 3    # tries before the workflow fails; a bad topic is final anyway

[candidates_activity]
timeout_sec = 30    # reading one JSON file the discover job wrote
max_attempts = 3    # tries before the workflow fails; a missing file is final anyway
