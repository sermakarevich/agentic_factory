[project]
name = "tutorial"
version = "0.1.0"
description = "The tutorial application: a topic into a numbered tutorial in the knowledge base. Engine-agnostic."
requires-python = ">=3.13"
dependencies = [
    "factory-settings",
    "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutorial"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
