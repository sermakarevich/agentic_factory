# Defaults of the application. Override without editing this file:
#   - settings.local.toml next to it (git-ignored), same layout;
#   - environment variables AF_<TABLE>__<KEY>, e.g. AF_JOB__TIMEOUT_SEC=7200;
#   - a .env file in the repo root, read on start.

[job]
provider = "opencode"         # the harness that runs it: claude | opencode
timeout_sec = 3600
stall_sec = 600               # no output for this long = kill
exit_wait_sec = 30            # how long a coder may take to exit after its output closed, or after a kill
usage_wait_sec = 60           # how long reading a try's usage back from the coder may take, when its stream lost the totals
compact_at_tokens = 150000     # the coder is asked to compact its context at this size; not a job option
context_limit_tokens = 200000  # kill and retry above this; the backstop when compaction did not happen
line_limit_bytes = 16777216    # longest stdout line the engine reads; a tool output can be one very long line
failure_tail_chars = 4000      # tail of the coder's output kept in a crash message
error_clip_chars = 500         # longest provider error text kept in a failure

[harness.opencode]
default_model = "opencode-go/muse-spark-1.3-contributor"

[harness.claude]
default_model = "sonnet"
autocompact_min_tokens = 100000  # the least claude accepts for --autocompact (100k to 1M); compact_at_tokens is raised to it

[step.judge]
provider = "typesafe"         # which judge answers: typesafe
timeout_sec = 60              # a judgment is one short call; the step's own limit

[step.judge.typesafe]
default_model = "jev-latest"
price_per_m_input_usd = 0.042   # what jev bills per million input tokens; output is free
retry_after_default_sec = 60    # wait after a rate limit that names no retry-after

[log]
content_width = 160           # longest event text on one log line
